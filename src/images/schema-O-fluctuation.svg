<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>O comme espace disponible, fluctuant sous l'impact du piloté et du subi</title>
<desc>Un espace entre deux parois. Piloté ouvre depuis la gauche, subi referme depuis la droite. O fluctue selon l'impact des deux.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="300" fill="#FDFBF7"/>
<rect x="60" y="80" width="90" height="140" rx="8" fill="#E4F2EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="105" y="105" font-size="14" font-weight="600" fill="#0F6E56" text-anchor="middle">piloté</text>
<text x="105" y="122" font-size="12" fill="#0F6E56" text-anchor="middle">ouvre</text>
<text x="105" y="138" font-size="12" fill="#0F6E56" text-anchor="middle">par choix</text>
<rect x="530" y="80" width="90" height="140" rx="8" fill="#FBEAE3" stroke="#993C1D" stroke-width="0.5"/>
<text x="575" y="105" font-size="14" font-weight="600" fill="#993C1D" text-anchor="middle">subi</text>
<text x="575" y="122" font-size="12" fill="#993C1D" text-anchor="middle">referme</text>
<text x="575" y="138" font-size="12" fill="#993C1D" text-anchor="middle">structurellement</text>
<rect x="150" y="80" width="380" height="140" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="340" y="150" font-size="15" font-weight="600" fill="#333" text-anchor="middle">O</text>
<text x="340" y="168" font-size="12" fill="#555" text-anchor="middle">espace disponible</text>
<line x1="160" y1="230" x2="220" y2="230" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<text x="190" y="250" font-size="12" fill="#085041" text-anchor="middle">impact</text>
<line x1="520" y1="230" x2="460" y2="230" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="490" y="250" font-size="12" fill="#712B13" text-anchor="middle">impact</text>
<text x="340" y="280" font-size="12" fill="#555" text-anchor="middle">O fluctue selon l'impact combiné de O_piloté et O_subi</text>
</svg>
