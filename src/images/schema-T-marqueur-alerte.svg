<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>E_T comme marqueur temporel et alerte de signature</title>
<desc>Trajectoire E(t) franchissant un seuil en T. Après T, deux issues possibles : stabilisation sur un nouvel état (bascule) ou retombée sans suite (pic).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="340" fill="#FDFBF7"/>
<line x1="60" y1="230" x2="620" y2="230" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="60" y1="230" x2="60" y2="50" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="600" y="248" font-size="13" fill="#555">t</text>
<text x="30" y="55" font-size="13" fill="#555">E</text>
<line x1="60" y1="120" x2="620" y2="120" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 4"/>
<text x="560" y="112" font-size="12" fill="#993C1D">seuil</text>
<path d="M60,200 C130,165 180,215 240,190 C290,165 320,140 340,122" fill="none" stroke="#378ADD" stroke-width="2"/>
<circle cx="340" cy="122" r="5" fill="#D85A30"/>
<line x1="340" y1="122" x2="340" y2="230" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="340" y="255" font-size="15" font-weight="600" fill="#993C1D" text-anchor="middle">T</text>
<text x="340" y="100" font-size="12" fill="#555" text-anchor="middle">marqueur + alerte</text>
<path d="M340,122 C390,90 450,80 620,78" fill="none" stroke="#639922" stroke-width="2"/>
<circle cx="620" cy="78" r="4" fill="#3B6D11"/>
<text x="470" y="66" font-size="12" fill="#3B6D11">bascule — nouvel état stable</text>
<path d="M340,122 C380,150 440,205 620,200" fill="none" stroke="#555" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 3"/>
<text x="470" y="218" font-size="12" fill="#555" opacity="0.7">pic sans suite — retombe</text>
<text x="340" y="300" font-size="12" fill="#555" text-anchor="middle">T dit qu'il faut regarder. Ce qui suit dit ce qui s'est passé.</text>
</svg>
