name: Zenodo

# Le site fait foi, Zenodo suit (décision du 28/10) : à chaque push qui touche un article,
# scripts/zenodo.mjs publie ce qui manque (absents, textes modifiés, liens entre dépôts),
# puis commite les DOI et empreintes et relance le déploiement pour que le site les affiche.
# Garde-fous : plafond de publications par passe (scripts/zenodo.mjs), `zenodo: false` en
# front matter, éditions longues exclues. Token : secret ZENODO_TOKEN (deposit:write + deposit:actions).

on:
  push:
    branches: [main]
    paths:
      - 'src/articles/**'
  workflow_dispatch:
    inputs:
      plafond:
        description: 'Nombre maximum de publications pour cette passe'
        default: '10'

permissions:
  contents: write   # commiter DOI et empreintes
  actions: write    # relancer le déploiement (un push du GITHUB_TOKEN ne déclenche aucun workflow)

concurrency:
  group: zenodo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publier sur Zenodo ce qui manque
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: node scripts/zenodo.mjs sync --envoyer --oui --plafond=${{ inputs.plafond || '10' }}

      - name: Commiter les DOI et empreintes, relancer le déploiement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/articles src/_data/zenodo.json; then
            echo "Rien à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/articles src/_data/zenodo.json
          git commit -m "Zenodo : DOI et empreintes après publication automatique"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
